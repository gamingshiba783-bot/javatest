<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa tòa nhà</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/building.css">
</head>

<body>

<!-- Thanh trên cùng -->
<header class="header">
    <div class="logo">
        <i class="bi bi-house"></i>
        Trang quản trị
    </div>

    <div class="user">
        Xin chào, nguyen van a
    </div>
</header>


<div class="container">

    <!-- Menu bên trái -->
    <aside class="sidebar">

        <div class="menu">
            <i class="bi bi-building"></i>
            Quản lý Tòa Nhà
        </div>

        <div class="menu">
            <i class="bi bi-person"></i>
            Quản lý Tài Khoản
        </div>

        <div class="menu">
            <i class="bi bi-people"></i>
            Quản lý Khách Hàng
        </div>

    </aside>


    <!-- Nội dung -->
    <main class="content">

        <div class="breadcrumb">
            <i class="bi bi-house-fill"></i>
            Home &nbsp;›&nbsp; Dashboard
        </div>

        <h2>Dashboard</h2>
        <span class="overview">» overview & stats</span>


        <form>

            <div class="form-row">
                <label>Tên tòa nhà</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Quận</label>
                <select>
                    <option>--Chọn Quận--</option>
                    <option>Quận 1</option>
                    <option>Quận 2</option>
                    <option>Quận 3</option>
                </select>
            </div>

            <div class="form-row">
                <label>Phường</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Đường</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Kết cấu</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Số tầng hầm</label>
                <input type="number">
            </div>

            <div class="form-row">
                <label>Diện tích sàn</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Hướng</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Hạng</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Diện tích thuê</label>
                <input type="text">
            </div>

        </form>

    </main>

</div>

</body>
</html>
